[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urim-engine"
version = "0.1.0"
description = "Urim pricing engine (v0: European equity option on QuantLib)"
requires-python = ">=3.11"
dependencies = ["QuantLib==1.43", "fastapi==0.141.1", "mcp==2.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "httpx>=0.27", "uvicorn==0.53.0"]

[tool.setuptools.packages.find]
include = ["engine*", "service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
